# Nginx · backend de ArtHub (API, paneles y login único) en api.TU_DOMINIO
#
# Copiar a /etc/nginx/sites-available/arthub-api, reemplazar TU_DOMINIO, enlazar en
# sites-enabled y recargar. El https lo agrega certbot (ver DESPLIEGUE.md, paso 8).

server {
    listen 80;
    listen [::]:80;
    server_name api.TU_DOMINIO;

    root /var/www/arthub-back/public;
    index index.php;
    charset utf-8;

    # Documentos del expediente hasta 20 MB (más margen del formulario).
    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Imágenes y archivos públicos subidos (storage:link): caché larga.
    location /storage/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock; # ajustar a la versión de PHP instalada
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s; # los certificados PDF tardan 1–2 s en generarse
    }

    # Nada de archivos ocultos (.env, .git…).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml model/gltf-binary;
}
