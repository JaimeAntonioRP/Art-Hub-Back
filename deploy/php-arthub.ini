; Límites de PHP para ArtHub. Copiar a /etc/php/8.5/fpm/conf.d/99-arthub.ini y
; /etc/php/8.5/cli/conf.d/99-arthub.ini, y recargar php8.5-fpm (ver DESPLIEGUE.md, paso 2).
; Los valores de fábrica (2 MB por archivo) no dejan subir fotos de celular ni documentos.
upload_max_filesize = 25M
post_max_size = 30M
; Generar el PDF del certificado y el modelo 3D reduce imágenes grandes en memoria.
memory_limit = 256M
max_execution_time = 60
